<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>신청 완료</title>

  <link rel="icon" href="./img/favicon_32x32.png" />
  <link rel="apple-touch-icon" href="./img/favicon_32x32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- =====================================================================
       done.html — 기본(5만원)등급 공용 완료화면
       ---------------------------------------------------------------------
       ★ 이 파일 하나를 전 기본등급 광고주가 공유한다(광고주별로 복사·수정 X).
       ★ 사무소명은 URL 파라미터 ?office=... 로 받아 자동 표시.
         → form-core의 THANKYOU_URL을 '.../done.html?office=밝은내일' 로 두면 됨.
         → 새 기본등급 광고주는 이 파일 손 안 대고 office 값만 바꿔 재사용.
       ★ 프리미엄(8만원)은 이 파일이 아니라 result.html(후기·카운트다운·트래킹)로 감.
       ★ 색: 밝은내일 랜딩(brand.css) 팔레트에 맞춤 — 흰바탕 + 파랑 + 쿨검정.
         자체완결형(외부 CSS 없이 단독으로 뜸)이라 어느 광고주 폴더에 넣어도 작동.
       ===================================================================== -->
  <style>
    :root{
      /* ★ 밝은내일 랜딩 brand.css 토큰과 동일 계열 */
      --primary:        #1f5fae;   /* 메인 파랑 */
      --primary-bright: #0b5bd3;   /* 버튼/강조 파랑 */
      --primary-bg:     #eaf2ff;   /* 옅은 파랑 배경 */
      --primary-border: #bcd5ff;
      --ink:            #0b2540;   /* 본문 진한 쿨검정 */
      --muted:          #5d6b7a;   /* 보조 텍스트 */
      --line:           #e6ecf5;
      --white:          #ffffff;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      background:
        radial-gradient(1100px 520px at 50% -8%, var(--primary-bg), transparent 62%),
        var(--white);
      color:var(--ink);
      min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .done{
      width:100%; max-width:440px;
      background:var(--white);
      border:1px solid var(--line);
      border-radius:24px;
      padding:clamp(28px,7vw,44px) clamp(22px,6vw,34px);
      text-align:center;
      box-shadow:0 20px 50px rgba(11,37,64,.10);
    }
    .done__check{
      width:76px; height:76px; margin:0 auto 22px;
      border-radius:50%;
      background:var(--primary-bg);
      display:flex; align-items:center; justify-content:center;
    }
    .done__check svg{ width:38px; height:38px; stroke:var(--primary-bright); }
    .done__title{
      font-size:clamp(22px,6vw,27px); font-weight:900; line-height:1.35;
      letter-spacing:-.02em; margin-bottom:14px; color:var(--ink);
    }
    .done__office{ color:var(--primary-bright); }
    .done__desc{
      font-size:clamp(14px,3.8vw,16px); line-height:1.75; color:var(--muted);
      word-break:keep-all; margin-bottom:26px;
    }
    .done__desc strong{ color:var(--ink); font-weight:700; }
    .done__note{
      background:var(--primary-bg);
      border:1px solid var(--primary-border);
      border-radius:14px;
      padding:15px 18px;
      font-size:clamp(13px,3.6vw,14.5px); line-height:1.7;
      color:var(--primary); word-break:keep-all;
    }
    .done__note b{ color:var(--primary-bright); }
  </style>
</head>
<body>
  <main class="done" role="main">
    <div class="done__check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>

    <h1 class="done__title">
      신청이 완료되었습니다
    </h1>

    <p class="done__desc">
      <strong class="done__office" data-office-slot>담당 사무소</strong>에서<br />
      회생 진행 가능성 진단 및 예상 탕감액 안내를 위해 연락드릴 예정입니다.
    </p>

    <div class="done__note">
      📞 <b>3회 이상 부재 시</b><br>무료 법률상담이 어려울 수 있으니<br>
      전화를 꼭 받아주세요.
    </div>
  </main>

  <!-- =====================================================================
       완료화면 스크립트 — URL 파라미터 office 읽어 사무소명만 표시
       · office : 사무소명 (form-core THANKYOU_URL에 ?office=... 로 심음)
       ★ 이름치환·카운트다운·후기·트래킹 없음(그건 프리미엄 result.html 전용).
         기본등급은 문자로 접수 안내가 나가므로 화면은 간결하게 유지.
       ===================================================================== -->
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(window.location.search);
    var office = (params.get('office') || '').trim();
    var officeEl = document.querySelector('[data-office-slot]');
    if (officeEl) officeEl.textContent = office || '담당 법률사무소';
  })();
  </script>
</body>
</html>
