<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>신청 완료</title>

  <link rel="icon" href="./img/favicon_32x32.png" />
  <link rel="apple-touch-icon" href="./img/favicon_32x32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- =====================================================================
       done.html — 기본(5만원)등급 공용 완료화면
       ---------------------------------------------------------------------
       ★ 이 파일 하나를 전 기본등급 광고주가 공유한다(광고주별로 복사·수정 X).
       ★ 사무소명은 URL 파라미터 ?office=... 로 받아 자동 표시.
         → form-core의 THANKYOU_URL을 '.../done.html?office=밝은내일' 로 두면 됨.
         → 새 기본등급 광고주는 이 파일 손 안 대고 office 값만 바꿔 재사용.
       ★ 프리미엄(8만원)은 이 파일이 아니라 result.html(후기·카운트다운·트래킹)로 감.
       ★ 색: 밝은내일 랜딩(brand.css) 팔레트에 맞춤 — 흰바탕 + 파랑 + 쿨검정.
         자체완결형(외부 CSS 없이 단독으로 뜸)이라 어느 광고주 폴더에 넣어도 작동.
       ===================================================================== -->
  
  <style>
    :root{
      /* ★ 밝은내일 랜딩 brand.css 토큰과 동일 계열 */
      --primary:        #1f5fae;   /* 메인 파랑 */
      --primary-bright: #0b5bd3;   /* 버튼/강조 파랑 */
      --primary-bg:     #eaf2ff;   /* 옅은 파랑 배경 */
      --primary-border: #bcd5ff;
      --ink:            #0b2540;   /* 본문 진한 쿨검정 */
      --muted:          #5d6b7a;   /* 보조 텍스트 */
      --line:           #e6ecf5;
      --white:          #ffffff;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      background:
        radial-gradient(1100px 520px at 50% -8%, var(--primary-bg), transparent 62%),
        var(--white);
      color:var(--ink);
      min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .done{
      width:100%; max-width:440px;
      background:var(--white);
      border:1px solid var(--line);
      border-radius:24px;
      padding:clamp(28px,7vw,44px) clamp(22px,6vw,34px);
      text-align:center;
      box-shadow:0 20px 50px rgba(11,37,64,.10);
    }
    .done__check{
      width:76px; height:76px; margin:0 auto 22px;
      border-radius:50%;
      background:var(--primary-bg);
      display:flex; align-items:center; justify-content:center;
    }
    .done__check svg{ width:38px; height:38px; stroke:var(--primary-bright); }
    .done__title{
      font-size:clamp(22px,6vw,27px); font-weight:900; line-height:1.35;
      letter-spacing:-.02em; margin-bottom:14px; color:var(--ink);
    }
    .done__office{ color:var(--primary-bright); }
    .done__desc{
      font-size:clamp(14px,3.8vw,16px); line-height:1.75; color:var(--muted);
      word-break:keep-all; margin-bottom:26px;
    }
    .done__desc strong{ color:var(--ink); font-weight:700; }
    .done__note{
      background:var(--primary-bg);
      border:1px solid var(--primary-border);
      border-radius:14px;
      padding:15px 18px;
      font-size:clamp(13px,3.6vw,14.5px); line-height:1.7;
      color:var(--primary); word-break:keep-all;
    }
    .done__note b{ color:var(--primary-bright); }
  </style>


<!-- ═══════════════════════════════════════════════════════════════ -->
<!--  광고 전환 픽셀 모음 (땡큐페이지 </head> 앞에 삽입)                    -->
<!--                                                                   -->
<!--  ▣ 이 파일이 하는 일                                                -->
<!--    유저가 폼 제출 후 이 땡큐페이지에 도착하면,                        -->
<!--    메타·당근·구글 3개 매체에 "전환(잠재고객 유입)"을 신호로 쏨.       -->
<!--                                                                   -->
<!--  ▣ 공통 원칙                                                       -->
<!--    · 매체별 <script> 블록을 완전히 분리 → 한 곳 터져도 딴 데 영향 X  -->
<!--    · uid 처리 로직은 함수로 감싸 스코프 격리 (블록끼리 변수 안 섞임) -->
<!--    · PageView/ViewPage/config = 페이지 도착 추적 → 매번 실행(중복OK)-->
<!--    · Lead/conversion = 전환 → uid 1개당 딱 1번만 발사              -->
<!--    · 뒤로가기 반복 방지: 발사하면 localStorage에 "찍었음" 기록,      -->
<!--      같은 uid로 재진입 시 스킵                                      -->
<!--    · 저장 키를 매체별로 다르게(접두어) → 서로 간섭 X                 -->
<!--        메타 : lead_fired_◯◯◯                                      -->
<!--        당근 : karrot_lead_fired_◯◯◯                               -->
<!--        구글 : google_lead_◯◯◯                                     -->
<!--      (키가 같으면 먼저 발사된 매체가 키를 만들어버려                  -->
<!--       나머지가 "이미 찍힘"으로 오인하고 스킵하는 사고 발생)           -->
<!--                                                                   -->
<!--  ▣ ★중요★ 메타·당근 vs 구글의 발사 방식 차이 (삽질로 알아낸 것)      -->
<!--    · 메타·당근 = "큐(queue)에 쌓았다가 스크립트 로드 후 처리"        -->
<!--      → 페이지가 uid검증/리디렉션으로 흔들려도 큐가 붙잡아서 안 날아감 -->
<!--      → 그래서 즉시실행(IIFE)으로 둬도 잘 됨. 절대 건드리지 말 것.     -->
<!--    · 구글 gtag = "호출 즉시 발사 시도"                             -->
<!--      → 이 페이지는 uid를 서버 검증(리디렉션)하는 구조라, 즉시 쏘면    -->
<!--         발사 직전에 페이지가 리셋되며 신호가 휩쓸려 사라졌음         -->
<!--      → 해결: 구글 conversion만 window 'load'(페이지 완전 로드 후)   -->
<!--         로 미뤄 발사 → uid검증·리디렉션 다 끝난 뒤 쏘니 안 날아감    -->
<!--                                                                   -->
<!--  ▣ 참고 (검증 시 헷갈렸던 것들)                                     -->
<!--    · Tag Assistant "URL 입력" 디버거는 이 페이지에선 원래 안 됨      -->
<!--      (봇 접속 차단 + gtag 즉시발사 전제 검수 → 우리 load 방식과 불일치)-->
<!--      → 실제 전환과 무관하니 판단 근거로 쓰지 말 것                   -->
<!--    · 애드블록/프라이버시 확장이 doubleclick 요청을 간헐 차단함        -->
<!--      → 테스트는 애드블록 끄고(또는 시크릿 창) 할 것                  -->
<!--    · 발사 확인법: F12 → 네트워크 탭 → 필터 "en=conversion"          -->
<!--      → 830866619 요청이 200/302로 뜨면 정상 발사                   -->
<!--    · 구글애즈 리포트 "전환 1"은 실제 광고클릭(gclid)+집계시간 필요    -->
<!--      → 직접 URL 방문 테스트로는 리포트에 안 잡힐 수 있음(정상)       -->
<!-- ═══════════════════════════════════════════════════════════════ -->

<!-- ▼▼▼ [1] 메타(페이스북/인스타) 픽셀 ▼▼▼ -->
<!-- ※ 발사 방식: 큐 기반 → 타이밍에 강함. IIFE 즉시실행 그대로 둘 것. -->
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '1795948951532455');  // 메타 픽셀 ID
fbq('track', 'PageView');         // 페이지 도착 → 매번 찍힘 (중복 OK)

// ── 전환(Lead): uid 1개당 딱 1번만 ──
(function () {
  var uid = new URLSearchParams(window.location.search).get('uid');  // URL에서 uid 꺼냄
  if (!uid) return;                                                  // uid 없으면 아무것도 안 함
  var firedKey = 'lead_fired_' + uid;                                // 이 uid 전용 저장 키
  if (!localStorage.getItem(firedKey)) {                             // 아직 안 찍혔으면
    fbq('track', 'Lead');                                            //   → 전환 1번 발사 ★
    localStorage.setItem(firedKey, '1');                             //   → "찍었음" 기록 (다음엔 스킵)
  }
})();
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1795948951532455&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->
<!-- ▲▲▲ [1] 메타 끝 ▲▲▲ -->


<!-- ▼▼▼ [2] 당근마켓 픽셀 ▼▼▼ -->
<!-- ※ 발사 방식: 큐 기반 → 타이밍에 강함. IIFE 즉시실행 그대로 둘 것. -->

<!-- ▼▼▼ [3] 구글애즈(유튜브 포함) 전환 태그 ▼▼▼ -->
<!-- ※ 발사 방식: 즉시발사 → 타이밍에 약함.                              -->
<!--   이 페이지의 uid검증/리디렉션에 신호가 휩쓸리는 걸 막으려고         -->
<!--   conversion만 'load'(페이지 완전 로드 후)로 미뤄서 발사함.         -->
<!--   ★이 load 감싸기를 IIFE로 되돌리면 자동 전환이 다시 안 잡힘★       -->
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-830866619"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-830866619');  // 페이지 로드 추적, 매번 실행 (중복 OK)

  // ── 전환(conversion): 페이지 완전히 로드된 후 발사 → uid당 1번만 ──
  window.addEventListener('load', function () {
    var uid = new URLSearchParams(window.location.search).get('uid');  // URL에서 uid 꺼냄
    if (!uid) return;                                                  // uid 없으면 발사 안 함
    var googleFiredKey = 'google_lead_' + uid;                         // 이 uid 전용 저장 키
    if (!localStorage.getItem(googleFiredKey)) {                       // 아직 안 찍혔으면
      gtag('event', 'conversion', {'send_to': 'AW-830866619/WHTyCMedueocELuJmIwD'});  // → 전환 발사 ★
      localStorage.setItem(googleFiredKey, '1');                       //   → "찍었음" 기록
    }
  });
</script>
<!-- End Google tag (gtag.js) -->
<!-- ▲▲▲ [3] 구글 끝 ▲▲▲ -->

</head>



<body>
  <main class="done" role="main">
    <div class="done__check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>

    <h1 class="done__title">
      신청이 완료되었습니다
    </h1>

    <p class="done__desc">
      <strong class="done__office" data-office-slot>담당 사무소</strong>에서<br />
      연락드릴 예정입니다.
    </p>

    <div class="done__note">
      📞 <b>3회 이상 부재 시</b><br>상담이 어려울 수 있으니<br>
      전화를 꼭 받아주세요.
    </div>
  </main>

  <!-- =====================================================================
       완료화면 스크립트 — URL 파라미터 office 읽어 사무소명만 표시
       · office : 사무소명 (form-core THANKYOU_URL에 ?office=... 로 심음)
       ★ 이름치환·카운트다운·후기·트래킹 없음(그건 프리미엄 result.html 전용).
         기본등급은 문자로 접수 안내가 나가므로 화면은 간결하게 유지.
       ===================================================================== -->
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(window.location.search);
    var office = (params.get('office') || '').trim();
    var officeEl = document.querySelector('[data-office-slot]');
    if (officeEl) officeEl.textContent = office || '담당 법률사무소';
  })();
  </script>
</body>
</html>
